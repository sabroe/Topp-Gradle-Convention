/*
 * CycloneDX convention plugin.
 *
 * @author Morten Sabroe Mortensen
 * @version 1.0
 * @since 2025-12-17
 */

plugins {
    id 'java'
    //Note: 'org.cyclonedx.bom' is not applied here, but below, only when 'convention.cyclonedx.enable' is true.
    //      Applied here, its tasks would always exist, also with the convention switched off.
    //      See https://plugins.gradle.org/plugin/org.cyclonedx.bom
}

def conventionName = "cyclonedx"

project.logger.info("Convention ${conventionName} loaded.")

project.plugins.withType(JavaPlugin) {  //Note: Not '.configureEach { }'; a plugin can't be applied from within it.
    def enablePropertyName = "convention.${conventionName}.enable"
    def enableText = project.findProperty(enablePropertyName)?.toString()?.trim()
    def enable = enableText ? enableText.toBoolean() : true  //Note: Not '?.toBoolean() ?: true'; Groovy's '?:' turns false into true.
    if (!enable) {
        project.logger.debug("Convention ${conventionName} disabled.")
    } else {
        project.logger.debug("Convention ${conventionName} enabled.")

        project.apply plugin: "org.cyclonedx.bom"

        project.afterEvaluate {
            tasks.named("cyclonedxDirectBom") {
                group = "reporting"
                description = "Generates a per-project CycloneDX SBOM (runtime dependencies only)"

                includeConfigs = ["runtimeClasspath"]
                skipConfigs = ["compileClasspath", "testCompileClasspath"]

                def componentType = org.cyclonedx.model.Component.Type.LIBRARY
                project.plugins.withId("application") {
                    componentType = org.cyclonedx.model.Component.Type.APPLICATION
                }
                project.plugins.withId("java-library") {
                    if (componentType != org.cyclonedx.model.Component.Type.APPLICATION) {
                        componentType = org.cyclonedx.model.Component.Type.LIBRARY
                    }
                }
                projectType = componentType

                def outputDir = project.file("build/reports/cyclonedx-direct")
                jsonOutput.set(new File(outputDir, "bom.json"))
                xmlOutput.set(new File(outputDir, "bom.xml"))
            }
        }

        // Publishes the SBOM with every Maven publication, as '<artifactId>-<version>-cyclonedx.json' and '.xml'.
        // This depends only on Gradle's 'maven-publish' plugin, not on any publishing convention: whatever creates
        // a Maven publication, the SBOM is added to it, and signed with it if signing is set up. Without
        // 'maven-publish', nothing happens. The task runs only when a publication needs its files, not in 'build'.
        project.plugins.withId("maven-publish") {
            def bomTask = project.tasks.named("cyclonedxDirectBom")
            project.extensions.getByType(org.gradle.api.publish.PublishingExtension).publications
                .withType(org.gradle.api.publish.maven.MavenPublication).configureEach { publication ->
                    publication.artifact(bomTask.flatMap { it.jsonOutput }) {
                        classifier = "cyclonedx"
                        extension = "json"
                    }
                    publication.artifact(bomTask.flatMap { it.xmlOutput }) {
                        classifier = "cyclonedx"
                        extension = "xml"
                    }
                }
        }
    }
}

/*
 * Note:
 *     To inspect the content of build BOM files, consider this command for ad hoc inspection:
 *     find . -name bom.* | grep -E "(.*)/build/reports/(.*)(bom.xml|bom.json)" | while read r; do echo; echo $r; head -n30 $r; done | less
 */
